<title>Metas de Emanuel y Juliana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@200;300;400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:#000;--fg:#fff;--mut:#8a8a8a;--line:#242424;--card:#0b0b0b;--card2:#141414;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff;--fg:#000;--mut:#6f6f6f;--line:#e6e6e6;--card:#fafafa;--card2:#f0f0f0;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff}}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:300 14px/1.55 Inter,system-ui,sans-serif;min-height:100vh;transition:background .4s,color .4s}
.script{font-family:'Great Vibes',cursive;font-weight:400}
/* Intro */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:opacity .9s,visibility .9s}
#intro.out{opacity:0;visibility:hidden}
#intro h1{font-size:clamp(50px,12vw,110px);line-height:1.15;font-weight:400;animation:reveal 2s .3s both}
#intro .ln{height:1px;background:var(--fg);width:0;margin:18px 0;animation:grow 1.6s 1.4s forwards}
#intro p{font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--mut);animation:reveal 1.4s 2s both}
@keyframes reveal{from{opacity:0;filter:blur(14px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
@keyframes grow{to{width:120px}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes dr{from{stroke-dashoffset:var(--c)}}
@keyframes dw{from{stroke-dashoffset:var(--l)}}
/* Base */
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 80px}
header{display:flex;justify-content:space-between;align-items:center;padding:26px 0;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
header h2{font-size:34px;font-weight:400;line-height:1}
.btns{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:transparent;color:var(--fg);padding:9px 16px;border-radius:99px;font:400 12px Inter;cursor:pointer;transition:.25s}
.btn:hover{border-color:var(--fg)}
.pri{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}
.pri:hover{opacity:.85}
.ic{width:36px;padding:9px 0;text-align:center}
header{position:sticky;top:0;z-index:40;background:var(--bg)}
.cd{display:flex;flex-direction:column;gap:7px;min-width:200px}
.cd small{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
.cd b{font-size:34px;font-weight:200;letter-spacing:.18em;font-variant-numeric:tabular-nums;line-height:1}
.ov.wd{align-items:flex-start;padding-top:150px}
.ov.wd .box{max-height:calc(100vh - 170px)}
.st{animation:up .4s both}
.bq{font-size:24px;font-weight:300;line-height:1.35;letter-spacing:-.01em;margin-bottom:16px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:300 14px Inter,system-ui,sans-serif;resize:none}
textarea:focus{outline:0;border-color:var(--fg)}
/* Profundidad */
.g{position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,border-color .3s,box-shadow .3s}
.g:hover{border-color:var(--fg);box-shadow:0 30px 50px -28px #000c;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px)}
.g.na{animation:none}
.g::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--fg) 12%,transparent),transparent 55%)}
.g:hover::after{opacity:1}
.g .im{transform:scale(1.1) translate(calc(var(--px,0)*-1px),calc(var(--py,0)*-1px));transition:filter .5s,transform .25s ease-out}
/* Buscador, gráficas, estado */
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl input{width:170px;border-radius:99px;padding:7px 14px;font-size:12px}
.ctl select{width:auto;border-radius:99px;padding:7px 12px;font-size:12px}
.cols.eq{grid-template-columns:1fr 1fr}
@media(max-width:780px){.cols.eq{grid-template-columns:1fr}}
@media(max-width:620px){.ov.wd{padding-top:200px}.ov.wd .box{max-height:calc(100vh - 220px)}}
.ct{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
@keyframes grow2{from{transform:scaleY(0)}}
.bg rect{opacity:.8;transition:opacity .2s}
.bg:hover rect{opacity:1}
.bv{fill:var(--fg);font:300 9px Inter,sans-serif;opacity:.65}
.bl{fill:var(--mut);font:300 9px Inter,sans-serif}
.dw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dwr{position:relative;width:150px}
.dwr svg{width:100%;display:block;overflow:visible}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 26px}
.dc small{font-size:9px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.dc b{font-size:13px;font-weight:300}
.seg{transition:stroke-width .2s;cursor:pointer}
.seg:hover{stroke-width:18}
.lg{font-size:12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:130px}
.lg span{display:flex;justify-content:space-between;gap:10px;color:var(--mut)}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fg);margin-right:8px}
.pc{padding:14px 0;border-bottom:1px solid var(--line)}
.pc:last-child{border:0}
.chip{font-size:10px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.chip.ok{border-color:var(--fg);color:var(--fg)}
.pb{display:grid;grid-template-columns:70px 1fr 110px;gap:10px;align-items:center;font-size:11px;color:var(--mut);margin-top:8px}
.pb b{color:var(--fg);font-weight:400;text-align:right}
.cd .syn{letter-spacing:.08em;text-transform:none;font-size:10px}
/* Mascota */
.pet{display:grid;grid-template-columns:230px 1fr;gap:24px;padding:24px;margin-top:26px;align-items:center}
@media(max-width:720px){.pet{grid-template-columns:1fr;justify-items:center;text-align:center}.pet .row,.pet .pn{justify-content:center}}
.pw{position:relative;width:200px;height:200px;margin:auto;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.pw svg{width:100%;height:100%;overflow:visible;animation:flt 3.2s ease-in-out infinite}
.pw.sad svg{animation:none;transform:translateY(4px)}
.pw.jump svg{animation:jmp .8s ease}
@keyframes flt{50%{transform:translateY(-6px)}}
@keyframes jmp{30%{transform:translateY(-30px) scale(1.06)}55%{transform:translateY(0) scale(1.05,.93)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes tw{50%{opacity:.15}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hrt{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-80px) scale(1.4)}}
.ln{fill:var(--bg);stroke:var(--fg);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.lf{fill:var(--fg)}
.ls{fill:none;stroke:var(--fg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
.tw{animation:tw 2.4s ease-in-out infinite}
.aura{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.ht{position:absolute;pointer-events:none;font-size:16px;animation:hrt 1.3s ease-out forwards}
.bub{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-size:14px;line-height:1.5;min-height:62px;animation:up .4s both}
.bub::before{content:'';position:absolute;left:-7px;top:24px;width:12px;height:12px;background:var(--card2);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
@media(max-width:720px){.bub::before{display:none}}
.pn{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pn span{font-size:11px;color:var(--mut);letter-spacing:.15em;text-transform:uppercase}
.lvs{display:flex;gap:6px;margin-top:14px}
.lvs i{width:26px;height:6px;background:var(--line);border-radius:3px;cursor:pointer;transition:.2s}
.lvs i.on{background:var(--fg)}
.lvs i:hover{transform:scaleY(1.8)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;transition:.3s}
.hero{display:grid;grid-template-columns:200px 1fr;gap:30px;padding:30px;margin-top:26px;align-items:center}
@media(max-width:720px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;width:100%}
.tile small{color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block}
.tile b{font-size:26px;font-weight:200;letter-spacing:-.02em}
.quote{grid-column:1/-1;color:var(--mut);font-size:13px;font-style:italic;border-top:1px solid var(--line);padding-top:16px;width:100%;text-align:center}
.bar{height:2px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:40px 0 14px;gap:10px;flex-wrap:wrap}
.sh h3{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;color:var(--mut)}
.tabs{display:flex;gap:6px}
.tab{padding:5px 14px;border-radius:99px;border:1px solid transparent;background:none;color:var(--mut);cursor:pointer;font:400 12px Inter;transition:.2s}
.tab.on{color:var(--bg);background:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.g{overflow:hidden;animation:up .7s backwards;animation-delay:calc(var(--i)*90ms)}
.g:hover{border-color:var(--fg);transform:translateY(-3px)}
.g .im{height:140px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:50px;filter:grayscale(1);cursor:pointer;background-color:var(--card2);transition:filter .5s}
.g:hover .im{filter:grayscale(.2)}
.g .b{padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g h3{font-size:19px;font-weight:300;cursor:pointer;letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-top:8px}
.row b{color:var(--fg);font-weight:400}
.acts{display:flex;gap:6px;margin-top:16px}
.acts .btn{flex:1;padding:8px 4px}
.acts .ic{flex:0 0 36px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:780px){.cols{grid-template-columns:1fr}}
.sec{padding:22px}
.mv{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
.mv:last-child{border:0}
.mv small{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
/* Charts */
.cw{position:relative}
.cw svg{width:100%;display:block;overflow:visible}
.tip{position:absolute;top:0;transform:translate(-50%,-110%);background:var(--fg);color:var(--bg);font-size:11px;padding:4px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.ring text{fill:var(--fg);font:200 22px Inter}
/* Modal */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;width:100%;max-width:460px;max-height:92vh;overflow:auto;animation:up .35s both}
.box.wide{max-width:600px}
.box h3{font-size:34px;font-weight:400;margin-bottom:10px}
label{display:block;font-size:11px;color:var(--mut);margin:12px 0 5px;letter-spacing:.05em}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font:300 13px Inter}
input:focus,select:focus{outline:0;border-color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.end{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

function ring(p,size,sw,label){const r=(size-sw)/2,c=2*Math.PI*r,o=c*(1-p/100);
 return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fg)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" style="--c:${c};animation:dr 1.4s cubic-bezier(.2,.8,.2,1) both"/>${label?`<text transform="rotate(90 ${size/2} ${size/2})" x="50%" y="50%" text-anchor="middle" dominant-baseline="central">${p}%</text>`:''}</svg>`}

function lc(id,pts){
 if(!pts.length)return '<div class="empty">Sin datos todavía</div>';
 if(pts.length<2)pts=[{x:pts[0].x-864e5*3,y:0,l:'Inicio'},...pts];
 const W=600,H=200,p=12,mx=Math.max(...pts.map(q=>q.y))*1.1||1,x0=pts[0].x,x1=pts[pts.length-1].x||x0+1;
 const X=v=>p+(v-x0)/((x1-x0)||1)*(W-2*p),Y=v=>H-p-(v/mx)*(H-2*p);
 const P=pts.map(q=>({...q,px:X(q.x),py:Y(q.y)}));CH[id]=P;
 const d=P.map((q,i)=>(i?'L':'M')+q.px.toFixed(1)+' '+q.py.toFixed(1)).join(' ');
 const len=Math.ceil(P.reduce((a,q,i)=>i?a+Math.hypot(q.px-P[i-1].px,q.py-P[i-1].py):0,0))+10;
 const grid=[0,.5,1].map(f=>`<line x1="${p}" x2="${W-p}" y1="${Y(mx/1.1*f)}" y2="${Y(mx/1.1*f)}" stroke="var(--line)" stroke-dasharray="2 5"/>`).join('');
 return `<div class="cw"><svg viewBox="0 0 ${W} ${H}" onmousemove="hov(event,'${id}')" ontouchmove="hov(event.touches[0],'${id}',event.currentTarget)" onmouseleave="hov(null,'${id}')">
 <defs><linearGradient id="gr${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--fg)" stop-opacity=".18"/><stop offset="1" stop-color="var(--fg)" stop-opacity="0"/></linearGradient></defs>${grid}
 <path d="${d} L${P[P.length-1].px} ${H-p} L${P[0].px} ${H-p}Z" fill="url(#gr${id})"/>
 <path d="${d}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="${len}" style="--l:${len};animation:dw 1.6s ease both"/>
 ${P.map(q=>`<circle cx="${q.px}" cy="${q.py}" r="2.5" fill="var(--bg)" stroke="var(--fg)"/>`).join('')}
 <line id="vl${id}" y1="${p}" y2="${H-p}" stroke="var(--fg)" stroke-opacity=".4" style="display:none"/><circle id="hc${id}" r="5" fill="var(--fg)" style="display:none"/></svg><span class="tip" id="tp${id}"></span></div>`}
function hov(e,id,svgEl){
 const vl=$('vl'+id),hc=$('hc'+id),tp=$('tp'+id);
 if(!e){vl.style.display=hc.style.display='none';tp.style.opacity=0;return}
 const svg=svgEl||e.currentTarget,rc=svg.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width*600,P=CH[id];
 const q=P.reduce((a,b)=>Math.abs(b.px-x)<Math.abs(a.px-x)?b:a);
 vl.setAttribute('x1',q.px);vl.setAttribute('x2',q.px);hc.setAttribute('cx',q.px);hc.setAttribute('cy',q.py);vl.style.display=hc.style.display='';
 tp.textContent=`${new Date(q.x).toLocaleDateString('es-CO')} · ${fmt(q.y)}`;tp.style.left=(q.px/600*100)+'%';tp.style.top=(q.py/200*rc.height)+'px';tp.style.opacity=1}
function series(gs){const ev=[];gs.forEach(g=>g.hist.forEach(h=>ev.push(h)));ev.sort((a,b)=>a.ts-b.ts);let s=0;return ev.map(h=>({x:h.ts,y:(s+=h.t==='d'?h.a:-h.a)}))}
function streak(){const w=t=>Math.floor((t+3*864e5)/(7*864e5)),s=new Set();S.goals.forEach(g=>g.hist.forEach(h=>{if(h.t==='d')s.add(w(h.ts))}));let c=w(Date.now()),n=0;if(!s.has(c))c--;while(s.has(c)){n++;c--}return n}
function count(el,to){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(f)})(t0)}

function card(g,i){

function pickImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,480/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpImg=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}

let SEC,LOCK=false,W=null;const STEP=60000;
function secret(){try{SEC=SEC||localStorage.getItem(KEY+'_s')}catch(e){}if(!SEC){SEC=Math.random().toString(36).slice(2)+Date.now();try{localStorage.setItem(KEY+'_s',SEC)}catch(e){}}return SEC}
function codeFor(n){let h=2166136261;const s=secret()+':'+n;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return String((h>>>0)%1000000).padStart(6,'0')}
const curN=()=>Math.floor(Date.now()/STEP);
function validCode(c){const n=curN();return c===codeFor(n)||c===codeFor(n-1)}
function tickCode(){const n=curN(),e=$('code'),b=$('cbar');if(e&&e.dataset.n!=n){e.dataset.n=n;const c=codeFor(n);e.textContent=c.slice(0,3)+' '+c.slice(3)}if(b)b.style.width=(100-(Date.now()%STEP)/STEP*100)+'%'}

 const o={old:(a,b)=>a.id-b.id,new:(a,b)=>b.id-a.id,hi:(a,b)=>pct(b)-pct(a),lo:(a,b)=>pct(a)-pct(b),date:(a,b)=>a.date.localeCompare(b.date),amt:(a,b)=>b.target-a.target,az:(a,b)=>a.title.localeCompare(b.title)};

 const R0=retoPend(),bn=R0&&RETOS[R0.k]?`<div class='rt' style='grid-column:1/-1'><div><b>Tienes un reto pendiente</b><span>${esc(RETOS[R0.k].t)} · ${fmt(R0.a)} — elige la meta donde quieras cumplirlo</span></div></div>`:'';let h=l.map((g,i)=>card(g,i)).join('');if(na)h=h.replace(/class="card g"/g,'class="card g na"');

 $('dist').innerHTML=`<div class='ct'>Reparto del ahorro</div>`+dist(gs);

function mbars(gs){
 const now=new Date(),ms=[],fs=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n));
 for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({k:d.getFullYear()*12+d.getMonth(),l:d.toLocaleDateString('es-CO',{month:'short'}).replace('.',''),v:0})}

function gameDo(){const n=rctx().n;gmClose();closeM();if(!n){toast('Creen una meta primero');return}retoPay(n.id)}
function retoCheck(id,a){
 if(RETOPAY!==id)return;RETOPAY=0;const R=GD&&GD.reto;if(!R||R.done)return;
 if(a>=R.a){GD={...GD,reto:{...R,done:true}};gset(GD);drawGoals(1);gameBadge();toast('¡Reto cumplido!');snd('win');if(typeof confetti==='function')confetti({particleCount:130,spread:90,origin:{y:.6},zIndex:300,colors:['#ffffff','#bbbbbb','#555555']})}
 else toast('Abonaste, pero el reto pide al menos '+fmt(R.a))}
function battle(){
 if(GM||!GD||!USER)return;
 const g=GD,pe=g.pick.emanuel,pj=g.pick.juliana,res=rps(pe,pj),me=USER.toLowerCase(),win=res===0?null:res===1?'emanuel':'juliana',los=win?(win==='emanuel'?'juliana':'emanuel'):null;
 GM=true;try{localStorage.setItem(KEY+'_gs_'+me,g.id)}catch(e){}
 gmOpen(`<div class='gm-x' onclick='gmClose()'>✕</div><div class='bt'><div class='bt-s'><div class='bt-n'>Emanuel</div><div class='bt-h sh1' id='h1'>${hand('r')}</div></div><div class='bt-v'>VS</div><div class='bt-s'><div class='bt-n'>Juliana</div><div class='bt-h sh1 mir' id='h2'>${hand('r')}</div></div></div><div class='bt-c' id='bc'></div><div class='bt-r' id='brs'></div><div id='bb'></div>`);
 const T=(f,ms)=>BT.push(setTimeout(f,ms)),say=t=>{const e=$('bc');if(e)e.textContent=t;snd('tick')};
 T(()=>say('Piedra…'),300);T(()=>say('Papel…'),1000);T(()=>say('Tijera…'),1700);T(()=>say('¡Ya!'),2400);
 T(()=>{const h1=$('h1'),h2=$('h2');if(!h1)return;h1.classList.remove('sh1');h2.classList.remove('sh1');h1.innerHTML=hand(pe);h2.innerHTML=hand(pj);h1.classList.add('hit');h2.classList.add('hit');if(win==='emanuel'){h1.classList.add('win');h2.classList.add('los')}else if(win==='juliana'){h2.classList.add('win');h1.classList.add('los')}$('bc').textContent=NM[pe]+' vs '+NM[pj];gmFlash();snd(res===0?'ok':win===me?'win':'wd')},2900);
 T(()=>{const e=$('brs');if(e)e.textContent=res===0?'¡Empate!':win===me?'¡Ganaste!':'Perdiste…'},3600);
 T(()=>{const b=$('bb');if(!b)return;
  if(res===0)b.innerHTML=`<div class='bt-s2'>Nadie gana esta vez. Pueden jugar otra ronda.</div><div class='bt-b'><button class='btn pri' onclick='gmClose();gameNew()'>Otra ronda</button><button class='btn' onclick='gmClose()'>Cerrar</button></div>`;
  else if(win===me){b.innerHTML=`<div class='bt-s2' id='wst'>${cap(los)} debe girar la ruleta de retos…</div><div class='bt-b'><button class='btn' onclick='gmClose()'>Cerrar</button></div>`;gameRefresh()}
  else{b.innerHTML=`<div class='bt-s2'>Te toca girar la ruleta de retos de ahorro…</div>`;BT.push(setTimeout(roulette,2000))}},4400)}
function roulette(){
 if(GD&&GD.reto){toast('Ya giraste la ruleta');return}
 const n=RETOS.length,a=360/n,R=100,me=USER;
 const seg=RETOS.map((r,i)=>{const a1=(i-.5)*a*Math.PI/180,a2=(i+.5)*a*Math.PI/180,x1=R*Math.sin(a1),y1=-R*Math.cos(a1),x2=R*Math.sin(a2),y2=-R*Math.cos(a2);return `<path d='M0 0 L${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z' fill='${i%2?'var(--bg)':'var(--fg)'}' stroke='var(--fg)' stroke-width='1'/><text transform='rotate(${i*a}) translate(0 -58) rotate(-90)' text-anchor='middle' dominant-baseline='central' style='font:500 9px Inter,sans-serif;fill:${i%2?'var(--fg)':'var(--bg)'}'>${r.l}</text>`}).join('');
 gmOpen(`<div class='gm-x' onclick='gmClose()'>✕</div><div class='rl-t script'>${me}, ¡a girar!</div><div class='rl-w'><div class='rl-p'></div><div class='rl-g' id='wg'><svg viewBox='-102 -102 204 204'>${seg}</svg></div><div class='rl-h'></div></div><button class='btn pri' id='spb' onclick='spin()'>Girar la ruleta</button><div id='rlr'></div>`);GM=true}
var SPUN=false;
function spin(){
 if(SPUN)return;SPUN=true;$('spb').style.display='none';
 const ctx=rctx(),n=RETOS.length,k=Math.floor(Math.random()*n),a=360/n,deg=360*6-k*a+(Math.random()-.5)*a*.6;
 $('wg').style.transform=`rotate(${deg}deg)`;
 let t=0,d=60;while(t<5300){const x=t;BT.push(setTimeout(()=>snd('tick'),x));d*=1.1;t+=d}
 BT.push(setTimeout(()=>{
  const o=RETOS[k].f(ctx);SPUN=false;snd('win');
  if(GD)gset({...GD,reto:{k,a:o.a,d:o.d,done:false}});
  if(typeof confetti==='function')confetti({particleCount:110,spread:80,origin:{y:.6},zIndex:300,colors:['#ffffff','#bbbbbb','#555555']});
  const e=$('rlr');if(e)e.innerHTML=`<div class='rc'><b>${esc(RETOS[k].t)}</b><div class='amt'>${fmt(o.a)}</div><p>${esc(o.d)}</p><div class='bt-b'><button class='btn pri' onclick='gameDo()'>Cumplir ahora</button><button class='btn' onclick='gmClose()'>Más tarde</button></div></div>`},5800))}

function SYN(on){const e=$('syn');if(e)e.textContent=on?'● Compartido en vivo':'Solo en este dispositivo'}
function sync(){if(!DBR)return;const cur={};
 S.goals.forEach(g=>{const c=clean(g);if(!c)return;const j=JSON.stringify(c);cur[c.id]=j;if(LAST[c.id]!==j)DBR.doc('goals/g'+c.id).set(c).catch(()=>toast('No se pudo sincronizar: ¿tienes permiso de edición?'))});
 Object.keys(LAST).forEach(id=>{if(!(id in cur))DBR.doc('goals/g'+id).delete().catch(()=>{})});LAST=cur}
(async function(){
 if(typeof claude==='undefined'||!claude.use)return;
 try{const db=await claude.use('db');if(!db){PINS.emanuel=PINS.juliana=null;return}DBP=db;db.doc('game/cur').onSnapshot(s=>{if(s.fromCache)return;GD=s.exists?s.data():null;gameBadge();gameCheck();gameRefresh();drawGoals(1)},()=>{});['emanuel','juliana'].forEach(k=>db.doc('meta/pin_'+k).onSnapshot(s=>{if(s.fromCache)return;const r=s.exists?s.data():null;PINS[k]=r&&r.s&&r.h?r:null;if(PINS[k])pinSaveLocal(k,PINS[k])},()=>{if(PINS[k]===undefined)PINS[k]=null}));
  const tm=setTimeout(()=>toast('La sincronización está tardando…'),10000);
  db.doc('meta/sec').onSnapshot(s=>{if(s.fromCache)return;if(s.exists&&s.data()&&s.data().s){SEC=String(s.data().s);const e=$('code');if(e)e.dataset.n='';tickCode()}else if(!s.exists){db.doc('meta/sec').set({s:secret()}).catch(()=>{})}},()=>{});
  db.collection('goals').onSnapshot(snap=>{clearTimeout(tm);if(snap.fromCache)return;SYN(true);
   const nw=snap.docs.map(d=>clean(d.data())).filter(Boolean).sort((a,b)=>a.id-b.id);
   if(!DBR){DBR=db;if(!nw.length&&S.goals.length){LAST={};sync();return}}
   LAST={};nw.forEach(g=>LAST[g.id]=JSON.stringify(g));
   const cur=JSON.stringify(S.goals.map(clean).filter(Boolean).sort((a,b)=>a.id-b.id));
   if(cur!==JSON.stringify(nw)){S.goals=nw;saveLocal();render()}
  },()=>{clearTimeout(tm);toast('Sincronización no disponible')});
 }catch(e){PINS.emanuel=PINS.juliana=null}
})();

/* ---- Retiro: preguntas una por una ---- */
const WZ=['¿Para qué necesitas exactamente este dinero? Detalla en qué se va cada peso.','¿Cuántas veces has retirado de esta meta antes, y por qué esta vez sería diferente?','¿Qué parte de este gasto es una necesidad real y qué parte es un deseo?','¿Qué otras fuentes de dinero intentaste usar antes de tocar este ahorro?','¿Qué emoción sientes ahora mismo y qué la provocó?','¿Qué estás sacrificando de tu sueño con este retiro? ¿Cuánto lo atrasa?','¿Cómo te sentirías si tu pareja viera este gasto mañana mismo?','¿Tu pareja sabe de este retiro y está de acuerdo? ¿Qué te dijo?','¿En qué fecha exacta y con qué dinero vas a reponer lo que sacas?','Con tus propias palabras: ¿por qué mereces romper tu compromiso hoy? (escribe además la clave dinámica)'];
function wdStart(id){
 const g=S.goals.find(x=>x.id===id);
 if(g.saved<=0){toast('Esta meta no tiene fondos para retirar');return}
 openM(`<div class="st"><h3 class="script">Retirar</h3><div class="row" style="margin:0">${esc(g.title)} · ${fmt(g.saved)}</div><div class="row" style="margin-top:14px">Protocolo anti-impulso: deberán responder ${WZ.length} preguntas, una tras otra. No se puede retirar hasta responderlas todas.</div>
 <form onsubmit="wdBegin(event,${id})"><div class="two"><div><label>Monto a retirar ($)</label><input id="w_a" type="number" min="1" step="any" required></div><div><label>¿Quién retira?</label><select id="w_w">${whoOpts(0)}</select></div></div>
 <div class="end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn pri">Comenzar</button></div></form></div>`);
 LOCK=true;$('ov').classList.add('wd');document.body.classList.add('wdm')}
function wdBegin(e,id){e.preventDefault();const g=S.goals.find(x=>x.id===id),a=parseFloat($('w_a').value);
 if(!(a>0)||a>g.saved){toast('El monto supera lo ahorrado ('+fmt(g.saved)+')');return}
 W={id,a,who:$('w_w').value,i:0,ans:[]};wdQ()}
function wdQ(){
 const n=WZ.length,last=W.i===n-1;
 $('box').className='box wide';
 $('box').innerHTML=`<div class="st"><div class="row" style="margin:0"><span>Pregunta ${W.i+1} de ${n}</span><span>Retiro ${fmt(W.a)}</span></div><div class="bar" style="margin:10px 0 28px"><i style="width:${W.i/n*100}%"></i></div>
 <form onsubmit="wdNext(event)"><div class="bq">${esc(WZ[W.i])}</div>
 <textarea id="w_t" rows="4" required placeholder="Responde con total honestidad..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea>
 ${last?'<label>Clave dinámica vigente (la de arriba, cambia cada 30 s)</label><input id="w_c" inputmode="numeric" maxlength="7" required placeholder="000 000" autocomplete="off">':''}
 <div class="end"><button type="button" class="btn" onclick="closeM()">Cancelar y conservar la meta</button><button class="btn pri">${last?'Confirmar retiro':'Responder'}</button></div></form></div>`;
 setTimeout(()=>{const t=$('w_t');if(t)t.focus()},60)}
function wdNext(e){e.preventDefault();
 const t=$('w_t').value.trim(),last=W.i===WZ.length-1;
 if(t.length<12){toast('Responde con más detalle (mínimo 12 caracteres)');return}
 if(last&&!validCode($('w_c').value.replace(/\D/g,''))){toast('Clave incorrecta o vencida');return}
 W.ans[W.i]=t;
 if(!last){W.i++;snd('tick');wdQ();return}
 const g=S.goals.find(x=>x.id===W.id),a=W.a;
 g.saved-=a;g.hist.push({t:'w',a,ts:Date.now(),who:W.who,note:'Retiro: '+W.ans[0],qa:W.ans});
 const add=Math.max(7,Math.ceil(a/g.target*180)),b=new Date(Math.max(new Date(g.date+'T00:00'),new Date()));b.setDate(b.getDate()+add);g.date=iso(b);
 save();closeM();render();toast('Retiro hecho · plazo +'+add+' días');snd('wd');petReact('wd',a)}
</script>
</body>
